<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Character Counter</title>
  <script defer src="script.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Fade-in animation */
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    .fade-in {
      animation: fadeIn 0.8s ease-in-out;
    }
    .fade-warning {
      animation: fadeIn 0.5s ease-in-out;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-r from-indigo-100 to-purple-100">

  <div class="fade-in bg-white border-2 border-gray-300 shadow-2xl rounded-2xl p-8 w-96 text-center">
    <h2 class="text-2xl font-bold mb-2 text-gray-700">Type Your Message</h2>
    <p class="text-sm text-gray-500 mb-4">200 characters max</p>

    <textarea id="message" rows="5"
      class="w-full border border-gray-400 rounded-lg p-3 focus:ring-2 focus:ring-indigo-400 outline-none resize-none text-gray-700"
      placeholder="Start typing here..."></textarea>

    <!-- Progress Bar -->
    <div class="w-full bg-gray-200 h-2 rounded-full mt-4 overflow-hidden">
      <div id="progress" class="h-2 bg-indigo-500 rounded-full transition-all duration-300" style="width: 0%;"></div>
    </div>

    <p id="counter" class="text-gray-600 mt-3 text-sm font-medium">0 / 200 characters</p>
    <p id="warning" class="text-red-500 text-sm mt-2 font-semibold hidden">⚠️ Character limit exceeded!</p>
  </div>

</body>
</html>
